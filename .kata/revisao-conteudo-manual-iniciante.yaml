  Revisão crítica do conteúdo do manual (manual/main.pdf, 82 pp.) concluída pela ótica
  do professor iniciante em ferramentas de IA: 19 achados verificados (3 blocos), correções
  aplicadas em 9 arquivos .tex + README, manual recompilado (82 pp., 0 erros, 0 overfull,
  0 citações indefinidas) e verificação de colabilidade no PDF final por dois extratores
