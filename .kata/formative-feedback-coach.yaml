think:
  problem: "Avaliar a skill proposta 'formative-feedback-coach' (coach de feedback formativo com IA) e produzir SKILL_formative-feedback-coach.md com templates de feedback por contexto (aluno típico, aluno com dislexia, aluno com TDAH), aplicando o método do briefing: verificar clareza/especificidade/acionabilidade (skill do briefing: chain-of-verification), gerar versões por necessidade (dua-educator) e reescrever para estimular reflexão (active-learning-stem). O acervo já tem ia-educacao-feedback (modelo Feed Up/Feed Back/Feed Forward, Hattie & Timperley 2007; máx. 2 ações por feedback), ia-educacao-verificacao (CoVe), ia-educacao-dua e ia-educacao-aprendizagem-ativa — o artefato deve ser coerente com elas."
  assumptions:
    - "chain-of-verification, dua-educator e active-learning-stem são externas ao acervo (proibidas na seção Dependências de SKILL.md — audit.sh check_external_deps) mas disponíveis localmente como ferramentas de trabalho; as homólogas internas (ia-educacao-verificacao, ia-educacao-dua, ia-educacao-aprendizagem-ativa, ia-educacao-feedback) são as fontes canônicas a referenciar no documento"
    - "O arquivo SKILL_formative-feedback-coach.md vai na raiz do repo (fora de skills/), não afeta check_readme/check_orphans; nenhuma skill existente é editada"
    - "Ocaso de uso base dos templates será uma redação argumentativa (contexto mais frequente de feedback docente em escala) com dois problemas concretos: argumento sem evidência e parágrafo de conclusão fraco — feedback sobre a tarefa, não sobre a pessoa (princípio da ia-educacao-feedback)"
    - "DUA: para aluno com dislexia — frases curtas, vocabulário acessível, sem ambiguidade, foco reduzido; para aluno com TDAH — estrutura explícita, uma ação por vez, prazo/contexto ancorado, sem excesso de texto. Nenhuma adaptação reduz o rigor do feedback"
    - "CoVe: cada template passa por verificação em 3 critérios — claro (uma leitura basta), específico (refere trecho concreto da entrega), acionável (a ação é realizável antes da próxima entrega) — registrada como checklist no documento"
    - "Reescrita reflexiva: cada template inclui 1 pergunta reflexiva junto das ações (ex.: 'Qual evidência fortalece seu argumento?') seguindo estratégia de aprendizagem ativa (estímulo à metacognição e à próxima ação, não só correção)"
  alternatives:
    - "alt A: criar a skill completa no acervo (skills/ia-educacao-formative-feedback-coach/SKILL.md) — descartado: o briefing pede Arquivo SKILL_*.md com templates por contexto; ia-educacao-feedback já cobre o design de feedback formativo com IA"
    - "alt B: templates para outros contextos (ex.: cálculo, projeto) — descartado: briefing pede explicitamente aluno típico, dislexia e TDAH"
    - "alt C: usar somente skills externas no processo — descartado: as internas são as fontes autorizadas do acervo; as externas complementam sem entrar no grafo de dependências"
    - "alt D: (escolhida) documento de avaliação + 3 templates na raiz, CoVe integrado ao template (checklist de verificação por feedback), homólogas internas como referências"
  unknowns: |
    PROPOSTAS (aguardando confirmação do usuário; se não responder, seguir as propostas):
    1. Caso de uso base → redação argumentativa sobre tecnologia em sala de aula (2 problemas: argumento sem evidência; conclusão fraca)
    2. Estrutura dos templates → bloco por contexto: Feed Up / Feed Back / Feed Forward + checklist CoVe + pergunta reflexiva
    3. Quantidade de ações → máx. 2 por feedback (regra da ia-educacao-feedback: mais paralisa)
    RESOLVIDO:
    1. Modelo Feed Up/Feed Back/Feed Forward confirmado na ia-educacao-feedback (Hattie & Timperley, 2007; 2-3 dimensões por rodada; equilíbrio entre o que funciona e o que melhorar)
    2. CoVe confirmada na ia-educacao-verificacao (perguntas atômicas, binárias, independentes; verificação proporcional ao impacto)
    3. Estratégias DUA por princípio confirmadas na ia-educacao-dua (Engajamento/Representação/Ação e Expressão; múltiplas formas de expressar aprendizagem; remover barreiras mantendo rigor)
