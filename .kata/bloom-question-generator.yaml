    - "Os 18 exemplos seguem a matriz bidimensional da ia-educacao-bloom: 6 níveis cognitivos × 4 tipos de conhecimento, com verbos presenciais clássicos (ex.: listar, explicar, calcular, diferenciar, julgar, projetar)"
    - "Disciplinas-alvo das 3 MCVs validadas (proposta, ajustável): Cálculo Diferencial e Integral (Matemática), Programação Estruturada (Tecnologia), Física I (Ciência) — uma MCQ por disciplina, cobrindo os níveis Aplicar/Analisar/Avaliar (valor em era de IA generativa)"
    - "Cada exemplo de questão indica nível Bloom, verbo, disciplina STHEM e alinhamento AIAS quando pertinente (padrão do acervo: nível AIAS e nível cognitivo são escolhas independentes mas coerentes)"
  alternatives:
