think:
  problem: >-
    A última edição do manual (commit 25fb799) foi calibrada para o OpenCode 1.18.29/30
    e validada em 1.18.31. O binário instalado hoje é o 2.0.27: (a) o catálogo de modelos
    gratuitos mudou — dos 7 perfis do Capítulo 6, três identificadores não existem mais
    (big-pickle, mimo-v2.5-free, muse-spark-1.2) e cinco gratuitos novos apareceram; e
    (b) a interface de linha de comando foi reorganizada — o subcomando web foi
    substituído por serve e há um conjunto novo de subcomandos e flags. O professor
    iniciante que seguir o Capítulo 6 escolhe um modelo inexistente, e quem seguir o
    Capítulo 5 digita um comando que não existe mais.
  assumptions:
    - "O binário instalado (opencode 2.0.27) e a saída de `opencode models` são a fonte da verdade para o que existe hoje; o manual é um retrato datado e já diz que o catálogo pode mudar."
    - "No pedido do usuário, 'modelos gratuitos disponíveis' = o tier comunitário opencode/*-free que o Capítulo 6 cobre."
    - "No pedido do usuário, 'novas opções' = provedores gratuitos alternativos (OpenRouter :free, NVIDIA, modelos locais), conforme a resposta ao questionário."
    - "A revisão é cirúrgica e mantém a voz, a estrutura pedagógica e o aviso de volatilidade do catálogo."
    - "README/CHANGELOG entram apenas como derivação adjacente."
  alternatives:
    - "alt A: reescrever apenas o Capítulo 6 — descartada isoladamente porque o Capítulo 5 ensinava `opencode web`, removido no v2."
    - "alt B: varredura completa do manual para o v2 (instalação, config, web/desktop, agentes/skills) — descartada nesta rodada por decisão do usuário (escopo = Cap. 6 + CLI)."
    - "alt C (escolhida): Capítulo 6 recatalogado + referências de CLI quebradas corrigidas + seção de rotas gratuitas alternativas."
    - "alt D: só registrar o diagnóstico — descartada: o usuário pediu execução."
  unknowns: |
    FONTES: opencode 2.0.27 instalado (`--version`, `--help`, `serve --help`, `run --help`,
    `models`, `models`), execução real de `opencode serve` e de `opencode web`, o PDF no
    HEAD 25fb799, os .tex do manual e a documentação oficial (opencode.ai/docs/providers,
    /docs/cli, /docs/web).

    ACHADOS VERIFICADOS — D: catálogo de modelos gratuitos (cap6), corrigidos:
      D1. `opencode/big-pickle` não existe mais → perfil do Big Pickle removido; removida
          também a frase sobre o stealth model do OpenCode Zen.
      D2. `opencode/mimo-v2.5-free` não existe → substituído por `opencode/mimo-v2.6-flash-free`
          (dica, perfil e matriz).
      D3. `opencode/muse-spark-1.2-contributor-free` não existe mais → perfil 1.2 removido.
      D4. Mantidos e conferidos: ling-3.0-flash-fin-free, muse-spark-1.3-contributor-free,
          nemotron-3-ultra-free, nemotron-3.5-lightning-free.
      D5. Novos gratuitos do tier, agora listados na subseção "Outros Modelos Gratuitos no
          Catálogo": ling-3.1-flash-free, longcat-2.5-preview-free, step-5-preview-free,
          exo-free, space-bunny-free.
      D6. Contagens fixas "sete perfis"/"7 modelos" removidas.

    ACHADOS VERIFICADOS — O: opções e CLI do v2, corrigidos:
      O1. cap5: `opencode web` NÃO é mais subcomando na v2.0.27 — a execução real devolveu
          `ENOENT: chdir '/tmp/opencode/probes' -> 'web'` (o CLI tratou 'web' como diretório).
          Substituído por `opencode serve` ("Start the v2 API and web server"), que foi
          executado com sucesso: "server listening on http://127.0.0.1:4096".
      O2. cap6: `opencode -m <modelo>` no comando raiz — a flag -m não consta nos flags do
          raiz no v2; a forma vigente é `/models` na TUI e `opencode run -m <modelo> "…"`.
      O3. Correção de fatos sobre autenticação: na v2.0.27 o `opencode serve` GERA e EXIBE
          uma senha de acesso automaticamente (observado sem OPENCODE_SERVER_PASSWORD
          definida); a edição anterior dizia "sem a variável, o servidor sobe sem
          autenticação" — corrigido para "exibe uma senha gerada; use
          OPENCODE_SERVER_PASSWORD para fixar a sua".

    DECISÕES DO USUÁRIO (via questionário, respondidas):
      1. Escopo: "Cap. 6 + referências de CLI".
      2. "Novas opções": "Provedores gratuitos alternativos".
      3. Execução: "Sim, executar após aprovar o escopo; commit, push".
      Correção de rumo: eu havia proposto incluir opencode-go/* como gratuito; a
      documentação oficial confirma que OpenCode Go é uma assinatura de baixo custo e
      OpenCode Zen cobra por uso — ambos são pagos, então foram tratados como tal (não
      como alternativas gratuitas).

    NÃO VERIFICADO (registrado como caveat):
      - A documentação pública em /docs/web/ ainda descreve `opencode web`, que já não
        existe na v2.0.27 instalada: divergência docs×binário, resolvida em favor do
        binário (o que o usuário executa).
      - O comportamento do OpenCode Desktop (app nativo) não foi exercitado.
      - Não reproduzi os casos de uso validados do Capítulo 10.
