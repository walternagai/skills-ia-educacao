  problem: "Após as revisões de instalação (v0.10.8-10), pedagógica (v0.10.9) e textual (v0.10.14), o manual ainda não teve varredura sistemática de conteúdo e organização: comandos e referências inconsistentes entre capítulos, descrições do ferramental divergentes do audit.sh e dos scripts reais, referências internas ambíguas (ex.: 'ver Seção 3') e conteúdo opcional misturado a capítulos operacionais (tutorial de Git no Cap. 4, grafo de dependências no Cap. 3), sem plano priorizado para decidir o que editar."
  assumptions:
    - "O LaTeX em manual/*.tex é a fonte canônica; main.pdf é derivado e será recompilado após edições."
    - "Scripts (.sh/.bat), agentes e skills do próprio repositório são a fonte da verdade para comandos, flags e contagens (adapter kata-docs); docs oficiais do OpenCode são fonte para métodos de instalação."
    - "A revisão é incremental e cirúrgica: sem reescrita de capítulos nem reorganização estrutural (apêndices) sem aprovação explícita do usuário."
    - "Revisões anteriores cobriram digitação e contagens pontuais; esta foca coerência de conteúdo, navegação e organização, sem repetir o já corrigido."
  alternatives:
    - "alt A: varredura automatizada (grep de comandos/contagens) apenas — descartada: não captura ambiguidade textual, fluxo de leitura nem organização."
    - "alt B: reescrita completa dos capítulos — descartada: risco alto, perderia o estilo e as revisões acumuladas, sem ganho proporcional."
    - "alt C: leitura integral dos 10 capítulos + verificação fática contra scripts/agentes/skills/bib + diagnóstico priorizado — escolhida."
  unknowns: |
    RESOLVIDO (verificado em 2026-09-10):
    1. Contagens: 62 skills (26+18+8+5+5) e 6 subagentes conferem com skills/ e .opencode/agents/; README e PDF (76 pp) conferem.
    2. Flags dos scripts: install/uninstall .sh/.bat aceitam --antigravity e --antigravity-cli; o Cap. 4 enumera apenas --antigravity (lacuna).
    3. audit.sh: deps_slugs lê apenas skills/*/SKILL.md; órfãs NÃO consideram subagentes; não há checagem de ciclos. Claims do Cap. 3 precisam de ajuste.
    4. referencias.bib: todas as chaves citadas existem; main.log com 0 overfull e 17 underfull.
    5. Comandos externos: brew/scoop/choco confirmados nos docs oficiais; Homebrew recomenda o tap anomalyco/tap/opencode (o manual cita só a fórmula oficial).
    6. Comando /model (Cap. 6) diverge do /models usado no restante do manual e nos docs.
    PENDENTE DE DECISÃO DO USUÁRIO (aprovação do plano):
